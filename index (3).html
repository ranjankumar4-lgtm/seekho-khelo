<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffd23f">
<title>सीखो और खेलो | Learn & Play</title>
<style>
:root{--bg:#fff3c4;--card:#ffffff;--ink:#27243a;--pill:#ffffff}
@media (prefers-color-scheme:dark){:root{--bg:#1d1b30;--card:#2b2848;--ink:#f4f1ff;--pill:#3a3660}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;min-height:44px}
.pill{background:var(--pill);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:8px 18px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer}
h1{text-align:center;font-size:34px;margin:6px 0 4px;line-height:1.2}
.sub{text-align:center;font-size:18px;margin:0 0 20px;opacity:.8}
.card{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:18px;text-align:center;box-shadow:0 6px 0 var(--ink)}
.menu{display:grid;gap:16px}
.big-btn{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;border:3px solid #27243a;border-radius:24px;font-size:28px;font-weight:800;font-family:inherit;color:#27243a;cursor:pointer;box-shadow:0 6px 0 #27243a;text-align:left}
.big-btn:active,.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #27243a}
.big-btn span{font-size:44px}
.m0{background:#ff8a65}.m1{background:#4dd0e1}.m2{background:#aed581}.m3{background:#ba9bff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .big-btn{flex-direction:column;text-align:center;gap:4px;font-size:24px}
.prog{font-size:18px;font-weight:700;opacity:.7}
.big{font-size:54px;line-height:1.3;min-height:80px;word-break:break-word;margin:6px 0}
.qt{font-size:26px;font-weight:800;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{padding:16px 6px;font-size:28px;font-weight:800;font-family:inherit;color:#27243a;border:3px solid #27243a;border-radius:20px;cursor:pointer;box-shadow:0 5px 0 #27243a}
.c0{background:#ffd23f}.c1{background:#ff8a65}.c2{background:#4dd0e1}.c3{background:#aed581}
.opt.ok{background:#2ecc71;animation:pop .4s}
.opt.bad{background:#bbb;opacity:.6;animation:shake .35s}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.stars{font-size:34px;letter-spacing:2px;margin:10px 0;word-break:break-all}
.msg{font-size:30px;font-weight:800;margin:6px 0}
.row{display:grid;gap:12px;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
let L='hi',cur,game,ac;
const sv=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
let stars=+(sv('stars')||0);
const $=s=>document.querySelector(s);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick_=a=>a[rand(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};

const T={
 title:{hi:'सीखो और खेलो',en:'Learn & Play'},
 sub:{hi:'चलो खेलते हुए सीखें!',en:"Let's learn by playing!"},
 math:{hi:'गणित',en:'Math'},comp:{hi:'कंप्यूटर',en:'Computer'},
 count:{hi:'गिनती',en:'Counting'},add:{hi:'जोड़',en:'Add'},sub_:{hi:'घटाओ',en:'Subtract'},mul:{hi:'पहाड़ा',en:'Tables'},
 back:{hi:'← वापस',en:'← Back'},great:{hi:'शाबाश!',en:'Well done!'},retry:{hi:'फिर कोशिश करो',en:'Try again'},
 again:{hi:'फिर खेलो',en:'Play again'},home:{hi:'घर',en:'Home'},
 howmany:{hi:'कितने हैं?',en:'How many?'},whatis:{hi:'यह क्या है?',en:'What is this?'},
 plus:{hi:'जोड़',en:'plus'},minus:{hi:'घटा',en:'minus'},times:{hi:'गुणा',en:'times'},eq:{hi:'बराबर कितना?',en:'equals what?'},
 done:{hi:'खेल खत्म!',en:'Game over!'},of:{hi:'सही',en:'correct'},
 best:{hi:'बहुत बढ़िया!',en:'Super!'},good:{hi:'अच्छा खेले! और खेलो',en:'Good job! Play more'}
};
const t=k=>T[k][L];

const N={ // computer words
 mouse:{hi:'माउस',en:'Mouse'},keyboard:{hi:'कीबोर्ड',en:'Keyboard'},monitor:{hi:'मॉनिटर',en:'Monitor'},
 printer:{hi:'प्रिंटर',en:'Printer'},laptop:{hi:'लैपटॉप',en:'Laptop'},headphones:{hi:'हेडफोन',en:'Headphones'},
 webcam:{hi:'वेबकैम',en:'Webcam'},speaker:{hi:'स्पीकर',en:'Speaker'},cpu:{hi:'सीपीयू',en:'CPU'}
};
const ID=(e,a)=>({e,q:T.whatis,a});
const BANK=[
 ID('🖱️','mouse'),ID('⌨️','keyboard'),ID('🖥️','monitor'),ID('🖨️','printer'),
 ID('💻','laptop'),ID('🎧','headphones'),ID('📷','webcam'),ID('🔊','speaker'),
 {e:'✍️',q:{hi:'टाइप करने के लिए क्या चाहिए?',en:'What do we use to type?'},a:'keyboard'},
 {e:'👆',q:{hi:'क्लिक करने के लिए क्या चाहिए?',en:'What do we use to click?'},a:'mouse'},
 {e:'📄',q:{hi:'कागज़ पर छापने के लिए?',en:'What prints on paper?'},a:'printer'},
 {e:'🎬',q:{hi:'वीडियो किस पर दिखता है?',en:'Where do we see videos?'},a:'monitor'},
 {e:'🎵',q:{hi:'गाना चुपचाप कान में सुनने के लिए?',en:'What do we use to listen privately?'},a:'headphones'},
 {e:'🧠',q:{hi:'कंप्यूटर का दिमाग कौन है?',en:'What is the brain of a computer?'},a:'cpu'}
];

function opts(ans){const s=new Set([ans]);let g=0;while(s.size<4&&g++<200){const v=ans+rand(-5,5);if(v>=0)s.add(v)}
 return shuffle([...s]).map(String)}

function gen(){
 const i=game.i,ty=game.type;
 if(ty==='count'){const n=rand(1,i<5?7:12),em=pick_(['🍎','⭐','🐱','🎈','🚗','🌸','🐟']);
  return{e:em.repeat(n),q:t('howmany'),say:t('howmany'),o:opts(n),a:String(n)}}
 if(ty==='add'){const m=i<5?10:20,a=rand(1,m-1),b=rand(1,m-a);
  return{e:`${a} + ${b} = ?`,q:'',say:`${a} ${t('plus')} ${b} ${t('eq')}`,o:opts(a+b),a:String(a+b)}}
 if(ty==='sub'){const m=i<5?10:20,a=rand(2,m),b=rand(1,a);
  return{e:`${a} − ${b} = ?`,q:'',say:`${a} ${t('minus')} ${b} ${t('eq')}`,o:opts(a-b),a:String(a-b)}}
 if(ty==='mul'){const x=pick_([2,3,4,5,10]),y=rand(1,i<5?5:10);
  return{e:`${x} × ${y} = ?`,q:'',say:`${x} ${t('times')} ${y} ${t('eq')}`,o:opts(x*y),a:String(x*y)}}
 const it=game.bank[i],others=shuffle(Object.keys(N).filter(k=>k!==it.a)).slice(0,3);
 const q=it.q[L];
 return{e:it.e,q,say:q,o:shuffle([it.a,...others]).map(k=>N[k][L]),a:N[it.a][L]}
}

function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
 const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);
 o.type=ok?'sine':'square';o.frequency.value=ok?660:200;g.gain.value=.1;o.start();
 o.frequency.setValueAtTime(ok?880:150,ac.currentTime+.12);o.stop(ac.currentTime+.25)}catch(e){}}
function speak(s){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);
 u.lang=L==='hi'?'hi-IN':'en-IN';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}

const render=h=>{$('#app').innerHTML=h};
const bar=(lang)=>`<div class="top">${lang?`<button class="pill" onclick="setL()">${L==='hi'?'English':'हिंदी'}</button>`:`<button class="pill" onclick="go(home)">${t('home')}</button>`}<div class="pill">⭐ ${stars}</div></div>`;
function go(f,...a){cur=()=>f(...a);cur()}
function setL(){L=L==='hi'?'en':'hi';cur()}

function home(){game=null;
 render(bar(true)+`<h1>${t('title')}</h1><p class="sub">${t('sub')}</p>
 <div class="menu">
 <button class="big-btn m0" onclick="go(menu)"><span>🔢</span>${t('math')}</button>
 <button class="big-btn m1" onclick="go(play,'comp')"><span>🖥️</span>${t('comp')}</button></div>`)}
function menu(){
 const b=(k,e,c)=>`<button class="big-btn ${c}" onclick="go(play,'${k}')"><span>${e}</span>${t(k==='sub'?'sub_':k)}</button>`;
 render(bar(true)+`<h1>${t('math')}</h1><div class="grid2" style="margin-top:16px">
 ${b('count','🍎','m0')}${b('add','➕','m1')}${b('sub','➖','m2')}${b('mul','✖️','m3')}</div>
 <div class="row"><button class="pill" onclick="go(home)">${t('back')}</button></div>`)}

function play(type){game={type,i:0,n:10,score:0,bank:type==='comp'?shuffle(BANK).slice(0,10):null};next()}
function next(){if(game.i>=game.n)return end();game.q=gen();game.tried=false;show()}
function show(){const q=game.q;
 render(bar(false)+`<div class="card"><div class="prog">${game.i+1} / ${game.n}</div>
 <div class="big">${q.e}</div><div class="qt">${q.q}</div>
 <button class="pill" onclick="say()">🔊</button>
 <div class="opts">${q.o.map((o,k)=>`<button class="opt c${k}" onclick="pick(this,${k})">${o}</button>`).join('')}</div></div>`);
 setTimeout(say,300)}
function say(){speak(game.q.say)}
function pick(btn,k){if(btn.disabled)return;const q=game.q;
 if(q.o[k]===q.a){
  if(!game.tried){game.score++;stars++;sv('stars',stars)}
  beep(true);speak(t('great'));btn.classList.add('ok');
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  game.i++;setTimeout(next,1100)
 }else{game.tried=true;beep(false);btn.classList.add('bad');btn.disabled=true;speak(t('retry'))}}
function end(){const s=game.score,ty=game.type;
 const m=s>=8?t('best'):t('good');beep(true);speak(`${t('done')} ${s} ${t('of')}`);
 render(bar(false)+`<div class="card"><div class="msg">🎉 ${t('done')}</div>
 <div class="stars">${'⭐'.repeat(s)||'🙂'}</div>
 <div class="msg">${s} / ${game.n} ${t('of')}</div><div class="qt">${m}</div>
 <div class="row"><button class="big-btn m2" onclick="go(play,'${ty}')">🔁 ${t('again')}</button>
 <button class="pill" onclick="go(home)">${t('home')}</button></div></div>`)}
go(home);
</script>
</body>
</html>
